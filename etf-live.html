const CH = {W:560, H:196, PADL:64, PADR:32, PADT:44, PADB:36,

  n = n || 4;
  const span = hi-lo, step = span/(n-1);
  const mag = step>=1 ? Math.pow(10, String(Math.floor(step)).length-1) : 1;
  let s = 10*mag;
  for(const m of [1,2,2.5,5,10]){ if(step/mag <= m){ s = m*mag; break; } }
  const ticks = [];
  for(let t = Math.floor(lo/s)*s; t <= hi + s*0.01 && ticks.length<8; t += s){
    if(t >= lo - s*0.01) ticks.push(t);

  const area = `${line} L ${pts[n-1][0].toFixed(1)},${H-PADB} `+
               `L ${pts[0][0].toFixed(1)},${H-PADB} Z`;
  let grid = "";
  for(const t of niceTicks(Math.min(...vals), Math.max(...vals))){
    const yy = Y(t);
    grid += `<line x1="${PADL}" y1="${yy.toFixed(1)}" x2="${W-PADR}" y2="${yy.toFixed(1)}" `+
            `stroke="var(--border)" stroke-width="1"/>`+
            `<text x="${PADL-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" `+
            `fill="var(--muted)" font-family="sans-serif">${+t.toPrecision(6)}</text>`;
  }
  // x labels: ~6 ticks, always including the final date
  let idxs = [];
  const k = Math.max(1, Math.floor(n/6));
  for(let i=0;i<n;i+=k) idxs.push(i);
  if(idxs[idxs.length-1] !== n-1){
    if((n-1) - idxs[idxs.length-1] >= 3) idxs.push(n-1);
    else idxs[idxs.length-1] = n-1;
  }
  idxs = idxs.filter((ii,pos,arr)=>pos===0 || ii-arr[pos-1] >= 3);
  let xlabels = "";
  for(const i of idxs){
    const dt = data[i][0].slice(5).replace("-","/");
    xlabels += `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" `+
               `font-size="11" fill="var(--muted)" font-family="sans-serif">${dt}</text>`;
  }
  // ---- label placement with collision handling ----
  const placed = [];
  const labelBox = (lx,ly,txt,fs,anchor)=>{
    const w = txt.length*fs*0.62 + 6;
    const y0 = ly - fs*0.85, y1 = ly + fs*0.3;
    return anchor==="middle" ? [lx-w/2,y0,lx+w/2,y1] : [lx-w,y0,lx,y1];
  };
  const collides = (b, slack)=>{
    slack = slack===undefined?4:slack;
    return placed.some(p => !(b[2]+slack < p[0] || p[2]+slack < b[0] ||
                              b[3]+slack < p[1] || p[3]+slack < b[1]));
  };
  const clampCX = (xx,txt,fs)=>{
    const half = txt.length*fs*0.31 + 4;
    return Math.min(Math.max(xx,half), W-half);
  };
  const textSVG = (lx,ly,txt,fs,fill,anchor)=>
    `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" `+
    `text-anchor="${anchor==="middle"?"middle":"end"}" font-size="${fs}" `+
    `font-weight="700" fill="${fill}" font-family="sans-serif">${txt}</text>`;
  const place = (txt,fs,cands,fill)=>{
    for(const [lx,ly,anchor] of cands){
      const b = labelBox(lx,ly,txt,fs,anchor);
      if(!collides(b)){ placed.push(b); return textSVG(lx,ly,txt,fs,fill,anchor); }
    }
    const [lx,ly,anchor] = cands[0];
    placed.push(labelBox(lx,ly,txt,fs,anchor));
    return textSVG(lx,ly,txt,fs,fill,anchor);
  };
  // econ events: only the latest of each type inside this window, on 1M chart
  let ev = "";
  if(events && events.length){
    const dates = data.map(d=>d[0]);
    const d0 = dates[0], d1 = dates[dates.length-1];
    const snap = ed => {
      if(dates.includes(ed)) return dates.indexOf(ed);
      const eo = Date.parse(ed+"T00:00:00Z");
      let best=0, bd=Infinity;
      dates.forEach((dd,i)=>{
        const df = Math.abs(Date.parse(dd+"T00:00:00Z")-eo);
        if(df<bd){bd=df;best=i;}
      });
      return best;
    };
    const latest = {};
    for(const e of events){
      if(e.date>=d0 && e.date<=d1 &&
         (!latest[e.label] || e.date>latest[e.label].date)) latest[e.label]=e;
    }
    const hits = Object.values(latest).map(e=>[snap(e.date),e.label])
                                       .sort((a,b)=>a[0]-b[0]);
    let prevX=null, lvl=0;
    for(const [i,label] of hits){
      const xx = X(i);
      if(prevX!==null && Math.abs(xx-prevX)<44) lvl = 1-lvl; else lvl = 0;
      prevX = xx;
      const lx = clampCX(xx,label,10);
      let ly=20;
      for(const cand of (lvl===0?[20,36]:[36,20])){
        if(!collides(labelBox(lx,cand,label,10,"middle"))){ ly=cand; break; }
      }
      placed.push(labelBox(lx,ly,label,10,"middle"));
      ev += `<line x1="${xx.toFixed(1)}" y1="${PADT}" x2="${xx.toFixed(1)}" y2="${H-PADB}" `+
            `stroke="${ECON_COLOR}" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.65"/>`+
            `<text x="${lx.toFixed(1)}" y="${ly}" text-anchor="middle" font-size="10" `+
            `font-weight="700" fill="var(--econ-label)" paint-order="stroke" `+
            `stroke="var(--surface)" stroke-width="3" font-family="sans-serif">${label}</text>`;
    }
  }
  const imax = vals.indexOf(Math.max(...vals));
  const imin = vals.indexOf(Math.min(...vals));
  const [ex,ey] = pts[n-1];
  const endTxt = money(vals[n-1]);
  const endSVG = place(endTxt,12,
    [[ex-8,ey-10,"end"],[ex-8,ey+26,"end"],[ex-70,ey-10,"end"],[ex-70,ey+26,"end"]],
    "var(--text)");
  const hiTxt = "High "+money(Math.max(...vals));
  const hx = clampCX(X(imax),hiTxt,11);
  const hiSVG = place(hiTxt,11,
    [[hx,Y(Math.max(...vals))-12,"middle"],[hx,Y(Math.max(...vals))+26,"middle"]], color);
  const loTxt = "Low "+money(Math.min(...vals));
  const lx = clampCX(X(imin),loTxt,11);
  const loSVG = place(loTxt,11,
    [[lx,Y(Math.min(...vals))+20,"middle"],[lx,Y(Math.min(...vals))-14,"middle"]], color);
  let marks = "";
  if(imax!==n-1) marks += `<circle cx="${X(imax).toFixed(1)}" cy="${Y(Math.max(...vals)).toFixed(1)}" r="4.5" fill="${color}"/>`;
  if(imin!==n-1 && imin!==imax) marks += `<circle cx="${X(imin).toFixed(1)}" cy="${Y(Math.min(...vals)).toFixed(1)}" r="4.5" fill="${color}"/>`;
  marks += hiSVG + loSVG;
  const end = `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="5" `+
              `fill="${color}" stroke="var(--surface)" stroke-width="2"/>${endSVG}`;
  const [bx,by,bw,bh] = CH.BLEED;
  return `<svg viewBox="${bx} ${by} ${W+bw} ${H+bh}" `+
         `style="width:100%;height:auto;display:block" role="img" aria-label="${ariaLabel}">`+
         `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">`+
         `<stop offset="0" stop-color="${color}" stop-opacity="0.30"/>`+
         `<stop offset="1" stop-color="${color}" stop-opacity="0.02"/>`+
         `</linearGradient></defs>${grid}${ev}`+
         `<path d="${area}" fill="url(#${gid})"/>`+
         `<path d="${line}" fill="none" stroke="${color}" stroke-width="3" `+
         `stroke-linejoin="round" stroke-linecap="round"/>`+
         `${marks}${xlabels}${end}</svg>`;
}
/* ============================== cards ============================== */
function yahooURL(sym){ return `https://finance.yahoo.com/quote/${sym}`; }
function cardHTML(def, st){
  const {sym,name,color} = def;
  const {price, chg, pct, tag, subPrice, subChg, subPct} = st;
  let priceHTML;
  const tagHTML = tag ? `<span class="tag">${tag}</span>` : "";
  if(subPrice !== undefined){
    priceHTML =
      `<div class="big">${money(price)}${tagHTML}</div>`+
      `${pill(chg,pct)}`+
      `<div class="subline">Regular close ${money(subPrice)} ${pill(subChg,subPct,true)}</div>`;
  }else if(st.prevCloseLine !== undefined){
    priceHTML =
      `<div class="big">${money(price)}${tagHTML}</div>`+
      `${pill(chg,pct)}`+
      `<div class="subline">Prev close ${money(st.prevCloseLine)}</div>`;
  }else{
    priceHTML = `<div class="big">${money(price)}${tagHTML}</div>${pill(chg,pct)}`;
  }
  let blocks = "";
  st.charts.forEach((ch,j)=>{
    blocks += chartSVG(ch.data, color, `g-${sym.toLowerCase()}-${j}`,
                       `${sym} ${ch.period} chart`, j===0 ? ECON_EVENTS : []);
    if(j < st.charts.length-1) blocks += `<div style="height:6px;"></div>`;
  });
  let rows = "";
  st.charts.forEach((ch,i)=>{
    const vals = ch.data.map(d=>d[1]);
    const c = vals[vals.length-1]-vals[0], p = c/vals[0]*100;
    const border = i===0 ? "border-top:1px solid var(--border);" : "";
    const pad = i===0 ? "padding:8px 2px 0;" : "padding:0 2px 8px;";
    const fg = c>=0 ? "var(--up)" : "var(--down)";
    rows += `<tr><td style="${pad}${border}">${ch.period} change</td>`+
            `<td style="${pad}${border}color:${fg};">${smoney(c)} (${spct(p)})</td></tr>`;
  });
  return `<div class="card">`+
    `<div class="card-head"><div><div class="ticker">`+
    `<a href="${yahooURL(sym)}" style="color:${color}">${sym}</a></div>`+
    `<div class="fname">${name}</div></div>`+
    `<div class="price">${priceHTML}</div></div>`+
    `${blocks}`+
    `<table class="stats">${rows}</table></div>`;
}
/* Per-symbol state from daily bars + live quote + session. */
function symbolState(def, bars, quote, sess, today){
  const todayBar = bars.find(b=>b.date===today) || null;
  // completed bars: in post/closed sessions today's bar (if present) is final
  const doneToday = todayBar && (sess.key==="post"||sess.key==="closed");
  const comp = doneToday ? bars : bars.filter(b=>b.date!==today);
  const lastC = comp[comp.length-1], prevC = comp[comp.length-2];
  const live = (quote && quote.date===today) ? quote.price : null;
  const mkData = n => {
    let data = comp.slice(-n).map(b=>[b.date,b.close]);
    if(live!==null && sess.key!=="closed"){
      const last = data[data.length-1];
      if(!(last[0]===today && last[1]===live)) data.push([today, live]);
    }
    return data;
  };
  const d1 = mkData(21), d3 = mkData(63);
  let s;
  if(sess.key==="open"){
    const price = live!==null ? live : lastC.close;
    s = {price, chg:price-lastC.close, pct:(price-lastC.close)/lastC.close*100};
  }else if(sess.key==="pre"){
    if(live!==null && live!==lastC.close){
      s = {price:live, chg:live-lastC.close, pct:(live-lastC.close)/lastC.close*100,
           tag:"Pre-Mkt", prevCloseLine:lastC.close};
    }else{
      const c = lastC.close-prevC.close;
      s = {price:lastC.close, chg:c, pct:c/prevC.close*100, tag:"Pre-Mkt"};
    }
  }else if(sess.key==="post"){
    if(live!==null && live!==lastC.close){
      const tot = live-prevC.close, rc = lastC.close-prevC.close;
      s = {price:live, chg:tot, pct:tot/prevC.close*100, tag:"Aft-Hrs",
           subPrice:lastC.close, subChg:rc, subPct:rc/prevC.close*100};
    }else{
      const c = lastC.close-prevC.close;
      s = {price:lastC.close, chg:c, pct:c/prevC.close*100, tag:"Aft-Hrs"};
    }
  }else{ // closed
    const c = lastC.close-prevC.close;
    s = {price:lastC.close, chg:c, pct:c/prevC.close*100, tag:"Closed"};
  }
  s.charts = [{period:"1M",data:d1},{period:"3M",data:d3}];
  return s;
}
function upcomingHTML(allData){
  let ref = "0000-00-00";
  for(const arr of allData) for(const [d] of arr) if(d>ref) ref=d;
  const refY = ref.slice(0,4);
  const items = [];
  for(const lab of ["CPI","PPI"]){
    const cand = ECON_EVENTS.filter(e=>e.label===lab && e.date>ref)
                            .sort((a,b)=>a.date<b.date?-1:1)[0];
    if(!cand) continue;
    const [y,m,dd] = cand.date.split("-").map(Number);
    const dt = new Date(Date.UTC(y,m-1,dd));
    const ds = dt.toLocaleDateString("en-US",
      {weekday:"short",month:"short",day:"numeric",timeZone:"UTC"}) +
      (String(y)!==refY ? ", "+y : "");
    items.push(`${cand.note} \u2014 ${ds}`);
  }
  if(!items.length) return "";
  return `<div class="upcoming"><b>Upcoming:</b><br>${items.join("<br>")}</div>`;
}

/* ============================== refresh loop ============================== */
const $ = id => document.getElementById(id);
let refreshSec = Math.min(3600, Math.max(5,
  parseInt(localStorage.getItem("etfLiveRefreshSec")||"30",10)||30));
let timer=null, cdTimer=null, nextAt=0, lastGood=null, painted=false;
function setStatus(t){ $("status").innerHTML = t; }
function showErr(msg){
  const e = $("err");
  if(msg){ e.style.display="block"; e.textContent = msg; }
  else e.style.display="none";
}

// ---- market data ----
// The page NEVER fetches Yahoo directly (no CORS header: verified
// 2026-09-26) and no longer uses public CORS proxies (also verified
// dead: allorigins times out / HTTP 500, corsproxy.io HTTP 401).
// Data arrives two ways:
//   1. embedded bundle in #bundled -> instant first paint, zero network;
//   2. same-origin "etf-live-bundle.json" (written next to this page by
//      build_live_bundle.py every 5 min on weekdays) -> newer data when
//      the host serves sibling files (e.g. GitHub Pages); fails fast
//      and silently everywhere else.
let bundled = null, bundledAt = null, bundleLive = false;
function validBundle(b){
  if(!b || typeof b.at !== "string" || !b.syms) return false;
  return SYMBOLS.every(d=>{
    const s = b.syms[d.sym];
    return s && s.bars && s.bars.length >= 5;
  });
}
try{
  const raw = document.getElementById("bundled").textContent;
  // The JSON sits between marker lines the bake script uses to find it;
  // those markers are NOT part of the JSON, so extract first, then parse.
  const m = raw.match(/\/\*__BUNDLE_START__\*\/([\s\S]*?)\/\*__BUNDLE_END__\*\//);
  const b = JSON.parse((m ? m[1] : raw).trim());
  if(validBundle(b)){ bundled = b.syms; bundledAt = b.at; }
}catch(e){ /* no bundle: page cannot render */ }
function bundledSymbol(sym){
  const s = bundled && bundled[sym];
  if(!s || !s.bars || s.bars.length < 5) return null;
  return {bars: s.bars.map(([date,close])=>({date, close})),
          live: (typeof s.live==="number" ? s.live : null),
          liveDate: s.liveDate || null};
}
function bundledAge(){
  if(!bundledAt) return "";
  try{
    const p = etParts(new Date(bundledAt));
    let h = +p.hour; const ap = h>=12 ? "PM" : "AM"; h = h%12 || 12;
    return `${p.month}/${p.day} ${h}:${p.minute} ${ap} ET`;
  }catch(e){ return ""; }
}
// Resting status: calm, says exactly how old the data is. No alarm.
function restingStatus(){
  const sess = marketSession();
  setStatus(`<span><span class="seg">ETF Live</span> · `+
    `<span class="seg">${sess.label}</span> · `+
    `<span class="seg">data as of ${bundledAge()}</span></span>`);
}
// Right after the JSON file delivered newer data.
function freshStatus(){
  setStatus(`<span class="st-ok"><span class="seg">ETF Live</span> · ${etClock()} · `+
    `<span class="seg">${marketSession().label}</span> · `+
    `<span class="seg">updated ${bundledAge()}</span></span>`);
}
function renderStates(items, isLive){
  const sess = marketSession(), today = etDateStr();
  const states = [], allData = [];
  for(const it of items){
    const y = it.y;
    const quote = (y.live!==null && y.liveDate) ? {date:y.liveDate, price:y.live} : null;
    const st = symbolState(it.def, y.bars, quote, sess, today);
    states.push([it.def, st]);
    st.charts.forEach(c=>allData.push(c.data));
  }
  $("cards").innerHTML = states.map(([d,s])=>cardHTML(d,s)).join("");
  $("upcoming").innerHTML = upcomingHTML(allData);
  lastGood = new Date();
  showErr("");
  painted = true;
  if(isLive) freshStatus(); else restingStatus();
}
// Instant first paint from the embedded bundle. False if no usable bundle.
function paintFromBundle(){
  const items = [];
  for(const def of SYMBOLS){
    const y = bundledSymbol(def.sym);
    if(!y) return false;
    items.push({def, y});
  }
  renderStates(items, false);
  return true;
}
// Best-effort refresh of the bundle JSON written next to this page.
// Works where the host serves sibling files (GitHub Pages); fails fast
// and silently elsewhere (file://, artifact viewers without siblings).
async function refreshFromFile(){
  const c = new AbortController();
  const t = setTimeout(()=>c.abort(), 10000);
  try{
    const r = await fetch("etf-live-bundle.json", {cache:"no-store", signal:c.signal});
    if(!r.ok) return false;
    const b = JSON.parse(await r.text());
    if(!validBundle(b) || !(b.at > bundledAt)) return false;
    bundled = b.syms; bundledAt = b.at; bundleLive = true;
    const items = SYMBOLS.map(def=>({def, y: bundledSymbol(def.sym)}));
    renderStates(items, true);
    return true;
  }catch(e){
    return false; // not served here; the embedded bundle stands
  }finally{
    clearTimeout(t);
  }
}
async function tick(){
  if(!painted && !paintFromBundle()){
    // The embedded bundle is the only guaranteed data path; without it
    // there is nothing to show.
    showErr("Couldn't load market data. Please reload the page.");
    setStatus(`<span class="st-retry">Waiting for market data…</span>`);
    schedule();
    return;
  }
  if(await refreshFromFile()){ /* freshStatus() set inside renderStates */ }
  else if(!bundleLive) restingStatus();
  schedule();
}
function schedule(){
  clearInterval(timer); clearInterval(cdTimer);
  nextAt = Date.now() + refreshSec*1000;
  timer = setTimeout(tick, refreshSec*1000);
  const cd = ()=>{
    const s = Math.max(0, Math.ceil((nextAt-Date.now())/1000));
    $("countdown").textContent = `next refresh in ${s}s · every ${refreshSec}s`;
  };
  cd(); cdTimer = setInterval(cd, 500);
}
function applyInterval(fromInput){
  let v = parseInt($("refreshSec").value,10);
  if(!isFinite(v)) v = refreshSec;
  v = Math.min(3600, Math.max(5, v));
  $("refreshSec").value = v;
  refreshSec = v;
  localStorage.setItem("etfLiveRefreshSec", String(v));
  if(fromInput) schedule();
}
$("applyRefresh").addEventListener("click", ()=>applyInterval(true));
$("refreshSec").addEventListener("keydown", e=>{
  if(e.key==="Enter") applyInterval(true);
});
// init
$("refreshSec").value = refreshSec;
tick();
</script>
